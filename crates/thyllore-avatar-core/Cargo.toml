[package]
name = "thyllore-avatar-core"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
authors = ["kodai731"]
description = "Layer 1 avatar domain (expression grouping, presets, humanoid mapping, validation) for ThylloreAnimation — no ECS, no Vulkan"
repository = "https://github.com/kodai731/Thyllore-Animation"

[dependencies]
anyhow = "1"
cgmath = "0.18"
ron = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thyllore-anim-core = { path = "../thyllore-anim-core" }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
thyllore-importer-core = { path = "../thyllore-importer-core" }
