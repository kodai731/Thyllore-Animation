[package]
name = "thyllore-vulkan-derive"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
authors = ["kodai731"]
description = "Proc-macro companion of thyllore-vulkan-core: #[derive(GpuResource)] destroys every GpuResource field in reverse declaration order. Depends on nothing but syn / quote"
repository = "https://github.com/kodai731/Thyllore-Animation"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["derive"] }
