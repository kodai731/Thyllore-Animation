# Single hand-written source of pass definitions.
# build.rs of thyllore-vulkan-core generates PassId / PassShaders / ALL_PASSES from this file.
# Set roles: frame = set 0, material = set 1, object = set 2, local = pass-owned set.

[pass.model]
stages = ["model/vertex.vert", "model/fragment.frag"]
sets = { 0 = "frame", 1 = "material", 2 = "object" }

[pass.gbuffer]
stages = ["gbuffer/vertex.vert", "gbuffer/fragment.frag"]
sets = { 0 = "frame", 1 = "material", 2 = "object" }

[pass.grid]
stages = ["editor/gridVertex.vert", "editor/gridFragment.frag"]
sets = { 0 = "frame", 1 = "material", 2 = "object" }

[pass.gizmo]
stages = ["editor/gizmoVertex.vert", "editor/gizmoFragment.frag"]
sets = { 0 = "frame", 1 = "material", 2 = "object" }

[pass.bone]
stages = ["editor/boneVertex.vert", "editor/boneFragment.frag"]
sets = { 0 = "frame", 1 = "material", 2 = "object" }

[pass.onion_skin_ghost]
stages = ["gbuffer/vertex.vert", "editor/onionSkinFragment.frag"]
sets = { 0 = "frame", 1 = "material", 2 = "object" }

[pass.onion_skin_composite]
stages = ["postprocess/tonemapVertex.vert", "editor/onionSkinCompositeFragment.frag"]
sets = { 0 = "local" }

[pass.water_resolve]
stages = ["postprocess/tonemapVertex.vert", "water/resolveFragment.frag"]
sets = { 0 = "frame", 1 = "local" }

[pass.flame_resolve]
stages = ["postprocess/tonemapVertex.vert", "flame/resolveFragment.frag"]
sets = { 0 = "frame", 1 = "local" }

[pass.tonemap]
stages = ["postprocess/tonemapVertex.vert", "postprocess/tonemapFragment.frag"]
sets = { 0 = "local" }

[pass.bloom_downsample]
stages = ["postprocess/tonemapVertex.vert", "postprocess/bloomDownsampleFragment.frag"]
sets = { 0 = "local" }

[pass.bloom_upsample]
stages = ["postprocess/tonemapVertex.vert", "postprocess/bloomUpsampleFragment.frag"]
sets = { 0 = "local" }

[pass.dof]
stages = ["postprocess/tonemapVertex.vert", "postprocess/dofFragment.frag"]
sets = { 0 = "local" }

[pass.auto_exposure_histogram]
stages = ["postprocess/autoExposureHistogram.comp"]
sets = { 0 = "local" }

[pass.auto_exposure_average]
stages = ["postprocess/autoExposureAverage.comp"]
sets = { 0 = "local" }

[pass.ray_query_shadow]
stages = ["raytracing/rayQueryShadow.comp"]
sets = { 0 = "local" }

[pass.water_caustic_splat]
stages = ["water/causticSplat.comp"]
sets = { 0 = "local" }

[pass.water_caustic_apply]
stages = ["water/causticApply.comp"]
sets = { 0 = "local" }

[pass.composite]
stages = ["postprocess/compositeVertex.vert", "postprocess/compositeFragment.frag"]
sets = { 0 = "local" }

[pass.billboard]
stages = ["editor/billboardVertex.vert", "editor/billboardFragment.frag"]
sets = { 0 = "local" }

[pass.imgui]
stages = ["editor/imguiVertex.vert", "editor/imguiFragment.frag"]
sets = { 0 = "local" }

[pass.effect_trace]
stages = ["raytracing/traceRayGen.rgen", "raytracing/traceMiss.rmiss", "raytracing/torusIntersection.rint", "water/torusClosestHit.rchit", "raytracing/sceneClosestHit.rchit"]
sets = { 0 = "local" }
