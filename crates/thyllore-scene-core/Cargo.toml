[package]
name = "thyllore-scene-core"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
authors = ["kodai731"]
description = "Scene persistence core for ThylloreAnimation — the SceneFields / FieldPath contract that composes an effect's nested parameter structs into scene serde, ownership, snapshot, scalar accessor and UI tables (filled by thyllore-effect-derive), plus the declare_scene_format! macro for flat resources. No ECS or rendering dependency."
repository = "https://github.com/kodai731/Thyllore-Animation"

[dependencies]
serde = { version = "1", features = ["derive"] }
thyllore-color-core = { path = "../thyllore-color-core" }
thyllore-scene-derive = { path = "derive" }
