[package]
name = "imgui-winit-support"
version = "0.11.0"
edition = "2021"
description = "winit support code for the imgui crate"
homepage = "https://github.com/imgui-rs/imgui-rs"
repository = "https://github.com/imgui-rs/imgui-rs"
documentation = "https://docs.rs/imgui-winit-support"
license = "MIT OR Apache-2.0"
categories = ["gui"]

[dependencies]
imgui = { package = "dear-imgui-rs", path = "../dear-imgui-rs" }
winit = { version = "0.29.3", default-features = false }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
winit = { version = "0.29.3", default-features = false, features = ["x11", "wayland"] }
