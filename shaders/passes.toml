# Single hand-written source of pass definitions.
# build.rs of thyllore-vulkan-core generates PassId / PassShaders / ALL_PASSES from this file.
# Set roles: frame = set 0, material = set 1, object = set 2, local = pass-owned set.

[pass.model]
stages = ["model/vertex.slang", "model/fragment.slang"]
sets = { 0 = "frame", 1 = "material", 2 = "object" }

[pass.gbuffer]
stages = ["gbuffer/vertex.slang", "gbuffer/fragment.slang"]
sets = { 0 = "frame", 1 = "material", 2 = "object" }

[pass.grid]
stages = ["editor/gridVertex.slang", "editor/gridFragment.slang"]
sets = { 0 = "frame", 1 = "material", 2 = "object" }

[pass.gizmo]
stages = ["editor/gizmoVertex.slang", "editor/gizmoFragment.slang"]
sets = { 0 = "frame", 1 = "material", 2 = "object" }

[pass.bone]
stages = ["editor/boneVertex.slang", "editor/boneFragment.slang"]
sets = { 0 = "frame", 1 = "material", 2 = "object" }

[pass.onion_skin_ghost]
stages = ["gbuffer/vertex.slang", "editor/onionSkinFragment.slang"]
sets = { 0 = "frame", 1 = "material", 2 = "object" }

[pass.onion_skin_composite]
stages = ["postprocess/tonemapVertex.slang", "editor/onionSkinCompositeFragment.slang"]
sets = { 0 = "local" }

[pass.water_resolve]
stages = ["postprocess/tonemapVertex.slang", "water/resolveFragment.frag"]
sets = { 0 = "frame", 1 = "local" }

[pass.flame_resolve]
stages = ["postprocess/tonemapVertex.slang", "flame/resolveFragment.frag"]
sets = { 0 = "frame", 1 = "local" }

[pass.wind_resolve]
stages = ["postprocess/tonemapVertex.slang", "wind/resolveFragment.slang"]
sets = { 0 = "frame", 1 = "local" }

[pass.wind_shadow_bake]
stages = ["wind/shadowBakeCompute.slang"]
sets = { 0 = "frame", 1 = "local" }

[pass.wind_upsample]
stages = ["postprocess/tonemapVertex.slang", "wind/upsampleFragment.slang"]
sets = { 0 = "local" }

[pass.tonemap]
stages = ["postprocess/tonemapVertex.slang", "postprocess/tonemapFragment.slang"]
sets = { 0 = "local" }

[pass.bloom_downsample]
stages = ["postprocess/tonemapVertex.slang", "postprocess/bloomDownsampleFragment.slang"]
sets = { 0 = "local" }

[pass.bloom_upsample]
stages = ["postprocess/tonemapVertex.slang", "postprocess/bloomUpsampleFragment.slang"]
sets = { 0 = "local" }

[pass.dof]
stages = ["postprocess/tonemapVertex.slang", "postprocess/dofFragment.slang"]
sets = { 0 = "local" }

[pass.auto_exposure_histogram]
stages = ["postprocess/autoExposureHistogramCompute.slang"]
sets = { 0 = "local" }

[pass.auto_exposure_average]
stages = ["postprocess/autoExposureAverageCompute.slang"]
sets = { 0 = "local" }

[pass.ray_query_shadow]
stages = ["raytracing/rayQueryShadow.comp"]
sets = { 0 = "local" }

[pass.water_caustic_splat]
stages = ["water/causticSplat.comp"]
sets = { 0 = "local" }

[pass.water_caustic_apply]
stages = ["water/causticApply.comp"]
sets = { 0 = "local" }

[pass.composite]
stages = ["postprocess/compositeVertex.slang", "postprocess/compositeFragment.slang"]
sets = { 0 = "local" }

[pass.billboard]
stages = ["editor/billboardVertex.slang", "editor/billboardFragment.slang"]
sets = { 0 = "local" }

[pass.imgui]
stages = ["editor/imguiVertex.slang", "editor/imguiFragment.slang"]
sets = { 0 = "local" }

[pass.effect_trace]
stages = ["raytracing/traceRayGen.rgen", "raytracing/traceMiss.rmiss", "raytracing/sceneClosestHit.rchit", "raytracing/torusIntersection.rint", "water/torusClosestHit.rchit"]
sets = { 0 = "local" }
