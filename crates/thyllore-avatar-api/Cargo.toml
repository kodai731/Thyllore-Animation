[package]
name = "thyllore-avatar-api"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
authors = ["kodai731"]
description = "PyO3 wheel crate for avatar setup: chain generation, spring bone editing, collider fitting, VRM export and related Blender addon functions."
repository = "https://github.com/kodai731/Thyllore-Animation"

[lib]
name = "thyllore_avatar_api"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3", "dep:pythonize", "thyllore-ml-api/python"]

[dependencies]
thyllore-ml-api = { path = "../thyllore-ml-api" }
thyllore-model-core = { path = "../thyllore-model-core" }
thyllore-anim-core = { path = "../thyllore-anim-core" }
thyllore-avatar-core = { path = "../thyllore-avatar-core" }
thyllore-exporter-core = { path = "../thyllore-exporter-core" }
thyllore-scene-core = { path = "../thyllore-scene-core" }
thyllore-math-core = { path = "../thyllore-math-core" }
anyhow = "1"
glam = "0.34"
ron = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"], optional = true }
pythonize = { version = "0.29", optional = true }
