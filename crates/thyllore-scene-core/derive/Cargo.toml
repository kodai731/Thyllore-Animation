[package]
name = "thyllore-scene-derive"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
authors = ["kodai731"]
description = "Proc-macro half of thyllore-scene-core (a separate crate only because Rust requires proc-macro = true): #[derive(SceneFields)] turns a component's field attributes into its scene serde record and its ownership, snapshot, scalar and UI tables. Re-exported by thyllore-scene-core; nothing depends on it directly."
repository = "https://github.com/kodai731/Thyllore-Animation"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["derive"] }
