# `paired = true` declares the roles Left<part> and Right<part>; `[[chain]]` lists parts from ancestor to descendant.

[[role]]
part = "Hips"
required = true
translation = true
patterns = [["hips"], ["hip"], ["pelvis"]]

[[role]]
part = "UpperLeg"
paired = true
required = true
patterns = [["upper", "leg"], ["upperleg"], ["thigh"], ["up", "leg"], ["upleg"]]

[[role]]
