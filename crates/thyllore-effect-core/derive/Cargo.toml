[package]
name = "thyllore-effect-derive"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
authors = ["kodai731"]
description = "Proc-macro half of thyllore-effect-core (a separate package only because Rust requires proc-macro = true): #[derive(UboPack)] writes struct fields into the vec4 slots of a SPIR-V generated UBO. Re-exported by thyllore-effect-core; nothing depends on it directly."
repository = "https://github.com/kodai731/Thyllore-Animation"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["derive"] }
