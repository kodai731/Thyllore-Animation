[package]
name = "thyllore-unity-verify-fixtures"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
authors = ["kodai731"]
description = "Generates the sidecar JSON and .anim clip consumed by tools/unity/verify/run.sh"
publish = false

[[bin]]
name = "unity-verify-fixtures"
path = "src/main.rs"

[dependencies]
thyllore-avatar-core = { path = "../../../../crates/thyllore-avatar-core" }
thyllore-exporter-core = { path = "../../../../crates/thyllore-exporter-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
