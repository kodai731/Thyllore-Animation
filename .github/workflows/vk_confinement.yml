name: VK Confinement

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  grep-checks:
    name: Grep checks
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no vk in src / tests
        run: "! grep -rn 'vk::\\|vulkanalia' src tests"
      - name: no re-export
        run: "! grep -rn 'pub use vulkan::\\*\\|pub use vulkanalia' crates/thyllore-vulkan-core/src"
      - name: no alias
        run: "! grep -n 'pub type .* = vk::' crates/thyllore-vulkan-core/src/types.rs"
      - name: no public vk-typed constant
        run: "! grep -rnE 'pub (const|static) [A-Z_]+: [^=]*(vk::|vulkanalia)' crates/thyllore-vulkan-core/src"

  dependency-graph:
    name: Dependency graph
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: check vulkanalia dependents
        run: test "$(cargo tree -i vulkanalia --depth 1 -e normal --workspace --prefix none | tail -n +2 | awk '{print $1}' | sort -u)" = "thyllore-vulkan-core"

  root-crate-check:
    name: Root crate compiles without vulkanalia
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup slangc
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/setup_slang.sh
      - name: check
        run: cargo check -p thyllore-animation --lib --no-default-features
